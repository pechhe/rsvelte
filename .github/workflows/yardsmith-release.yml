# YardSmith fork only: builds the patched `svelte-check` for the two platforms
# YardSmith runs on and attaches them, with a checksum list, to a GitHub release
# named after the commit. Run by hand: `gh workflow run yardsmith-release.yml`.
name: YardSmith release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build svelte-check (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, triple: darwin-arm64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, triple: linux-x64-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout svelte submodule (shallow)
        run: git submodule update --init --checkout --depth 1 submodules/svelte

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build svelte-check
        run: cargo build --profile dist -p rsvelte_check --bin svelte_check --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/dist/svelte_check" "stage/svelte-check-${{ matrix.triple }}"

      # A binary that needs a newer glibc than the image provides fails on older hosts.
      - name: Check glibc floor
        if: startsWith(matrix.triple, 'linux-')
        run: scripts/release/check-glibc-floor.sh stage/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: svelte-check-${{ matrix.triple }}
          path: stage/svelte-check-${{ matrix.triple }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: stage
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd stage
          chmod +x svelte-check-*
          sha256sum svelte-check-* > SHA256SUMS
          cat SHA256SUMS
          tag="yardsmith-${GITHUB_SHA::10}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes "Patched svelte-check built from $GITHUB_SHA" \
            svelte-check-* SHA256SUMS
